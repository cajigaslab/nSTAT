name: Build and deploy intro page

on:
  push:
    branches: [master]
    paths:
      - 'docs/intro.md'
      - 'docs/paper_examples.md'
      - 'docs/conf.py'
      - 'docs/figures/**'
      - 'helpfiles/*.html'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Sphinx stack (matches nSTAT-python)
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'sphinx>=8.0' 'sphinx-rtd-theme>=3.0' \
            'myst-parser>=4.0' 'sphinx-design>=0.5' \
            'linkify-it-py>=2.0'   # required by myst_enable_extensions: linkify

      - name: Build the site
        run: sphinx-build -b html -W docs/ docs/_build/html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
